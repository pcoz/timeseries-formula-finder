# Publish timeseries-formula-finder to PyPI when a semver tag (e.g. v0.2.1)
# is pushed.
#
# This workflow uses PyPI's *trusted publishing* (PEP 740 / OIDC),
# which means **no API token secret** is stored in this repo. The
# trust relationship is configured on PyPI's side — see the
# one-time setup steps below.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP (do this once, in a browser, before the first release)
# ---------------------------------------------------------------------------
#
# 1. Log in to PyPI as the account that owns
#    https://pypi.org/project/timeseries-formula-finder/.
#
# 2. Go to the project's Settings → Publishing → "Add a new
#    publisher" (GitHub Actions).
#
# 3. Fill in:
#       PyPI project name:    timeseries-formula-finder
#       Owner:                pcoz
#       Repository name:      timeseries-formula-finder
#       Workflow filename:    publish.yml
#       Environment name:     pypi
#
# 4. Save. PyPI will now accept publishes from this workflow,
#    running under this repo's `pypi` environment, with no API
#    token needed.
#
# 5. In this GitHub repo's Settings → Environments, create an
#    environment named `pypi` (no protection rules required for
#    a single-maintainer project; add a "required reviewer" rule
#    if you want a manual gate before publishing).
#
# ---------------------------------------------------------------------------
# RELEASE PROCEDURE
# ---------------------------------------------------------------------------
#
# The version lives in TWO places and both must match the tag:
#     pyproject.toml   [project] version = "X.Y.Z"
#     ppf/__init__.py  __version__ = "X.Y.Z"
# The build job checks this and fails before building if they differ.
#
# 1. Bump the version in pyproject.toml AND ppf/__init__.py.
# 2. Commit.
# 3. Tag and push:
#        git tag vX.Y.Z
#        git push origin vX.Y.Z
# 4. This workflow runs, verifies the versions, builds sdist + wheel,
#    and publishes to PyPI under the trusted-publisher relationship
#    configured above.

name: publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml and ppf/__init__.py
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)["project"]["version"]
          init = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']',
                           open("ppf/__init__.py", encoding="utf-8").read(), re.M).group(1)
          print(f"tag={tag} pyproject={pyproject} ppf.__version__={init}")
          if not (tag == pyproject == init):
              sys.exit("Version mismatch: the tag, pyproject.toml and ppf/__init__.py must agree.")
          PY

      - name: Install the build tool
        run: python -m pip install --upgrade build

      - name: Build the distribution artefacts
        run: python -m build

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The id-token write permission is what lets the workflow
      # mint a short-lived OIDC token that PyPI trusts. Without
      # it, trusted publishing won't work.
      id-token: write
    steps:
      - name: Download the artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
